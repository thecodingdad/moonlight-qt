# GameLodge only ships Moonlight on Windows (x64): one build for pull requests and by hand.
# Releases are built together with GameLodge.
name: Build (Windows x64)
permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      QT_VERSION: '6.11.1'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set CI version
        shell: bash
        run: echo "CI_VERSION=${GITHUB_SHA::6}" >> "$GITHUB_ENV"

      # Protocol additions (Apollo server commands) the common-c submodule's upstream lacks.
      - name: Patch moonlight-common-c
        run: python moonlight-common-c\patches\apollo-server-commands.py moonlight-common-c\moonlight-common-c\src

      - name: Download dependencies
        run: powershell ./setup-deps.ps1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: false
          add-tools-to-path: false
          version: ${{ env.QT_VERSION }}
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'

      - name: Build
        shell: cmd
        run: |
          set "PATH=%QT_PATH%;%PATH%"
          scripts\build-arch.bat Release x64
        env:
          QT_PATH: ${{ github.workspace }}\..\Qt\${{ env.QT_VERSION }}\msvc2022_64\bin

      - uses: actions/upload-artifact@v6
        with:
          name: Moonlight-Windows-x64-${{ env.CI_VERSION }}
          path: build/deploy-x64-release/*
          retention-days: 14
